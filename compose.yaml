services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: importflow
      POSTGRES_USER: importflow
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - importflow_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U importflow -d importflow]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      target: demo
    environment:
      DATABASE_URL: postgres://importflow:local-demo-only@db:5432/importflow?sslmode=disable
      DEMO_MODE: "true"
      LISTEN_ADDR: 0.0.0.0:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, /app/importflow, health]
      interval: 10s
      timeout: 3s
      retries: 5
  tests:
    profiles: [test]
    build:
      context: .
      target: verify
    environment:
      TEST_DATABASE_URL: postgres://importflow:local-demo-only@db:5432/importflow?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
volumes:
  importflow_db:
